<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2027학년 수능</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1b1d21;--sub:#6b7280;--bd:#e2e5ea;--ac:#3b6fd9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#121316;--card:#1d1f24;--tx:#eceef1;--sub:#9aa1ad;--bd:#2d3037}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;line-height:1.45}
#app{max-width:560px;margin:0 auto;padding:18px 14px 28px}
h1{font-size:28px;margin:18px 0 4px}.sub{color:var(--sub);font-size:15px;margin:0 0 22px}
.lang{display:flex;gap:8px}.lang button{flex:1;font:inherit;color:inherit;border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:10px 4px;font-size:14px;cursor:pointer}
.lang button.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
a.card{display:flex;align-items:center;gap:16px;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px 16px;margin-bottom:14px;color:inherit;text-decoration:none}
.g{width:58px;height:58px;border-radius:15px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;flex:none}
.card b{font-size:19px;display:block}.card small{color:var(--sub);font-size:13px}.ar{margin-left:auto;font-size:22px;color:var(--sub)}
</style></head><body><div id="app"></div>
<script>
const SK="sn2027-lang";
const T={
ko:{h:"2027학년 수능",sub:"과목을 선택하세요.",a:"제2외국어/한문",as:"중국어Ⅰ · 일본어Ⅰ · 한문Ⅰ",b:"영어",bs:"듣기 음원 포함 · 45문항"},
en:{h:"2027 CSAT",sub:"Choose a subject.",a:"Second Foreign Language / Classical Chinese",as:"Chinese I · Japanese I · Classical Chinese I",b:"English",bs:"With listening audio · 45 questions"},
yue:{h:"2027學年 韓國高考",sub:"請揀科目。",a:"第二外語／漢文",as:"中國語I · 日本語I · 漢文I",b:"英語",bs:"附聆聽錄音 · 45題"}};
const ok=x=>["ko","en","yue"].includes(x);
let lang="";try{lang=localStorage.getItem(SK)||""}catch(e){}
if(!ok(lang)){const n=(navigator.language||"ko").toLowerCase();lang=n.startsWith("ko")?"ko":(n.includes("hk")||n.startsWith("yue"))?"yue":"en"}
function render(){
 const t=T[lang];try{localStorage.setItem(SK,lang)}catch(e){}
 document.documentElement.lang=lang=="yue"?"yue-HK":lang;document.title=t.h;
 document.getElementById("app").innerHTML=`<div class="lang">${[["ko","한국어"],["en","English"],["yue","廣東話"]].map(([k,n])=>`<button data-l="${k}" class="${k==lang?"on":""}">${n}</button>`).join("")}</div>
 <h1>${t.h}</h1><p class="sub">${t.sub}</p>
 <a class="card" href="sn2027.html?lang=${lang}"><div class="g" style="background:#d9483b">外</div><div><b>${t.a}</b><small>${t.as}</small></div><span class="ar">›</span></a>
 <a class="card" href="sn2027en.html?lang=${lang}"><div class="g" style="background:#3b6fd9">EN</div><div><b>${t.b}</b><small>${t.bs}</small></div><span class="ar">›</span></a>`;
 document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{lang=b.dataset.l;render()});
}
render();
</script></body></html>
